{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Ro'yxatdan O'tish</title>
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'app/app-assets/images/ico/favicon.ico' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-lg p-4">
            <h2 class="text-center mb-4">Ro'yxatdan O'tish</h2>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data" class="row g-3">
                {% csrf_token %}

                <div class="col-md-4">
                    <label class="form-label">Ism</label>
                    <input type="text" name="ism" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Familiya</label>
                    <input type="text" name="familiya" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Otasining ismi</label>
                    <input type="text" name="otasining_ismi" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tug`ulgan sana</label>
                    <input type="date" name="tugulgan_sana" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Ilmiy daraja</label>
                    <input type="text" name="ilmiy_daraja" class="form-control">
                </div>

                <!-- Dynamic foydalanuvchi roli -->
                <div class="col-md-6">
                    <label class="form-label">Foydalanuvchi roli</label>
                    <select class="form-select" name="foydalanuvchi_rol" required>
                        <option value="">Tanlang...</option>
                        {% for key, label in foydalanuvchi_rollari %}
                        <option value="{{ key }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Fakultet -->
                <div class="col-md-6">
                    <label class="form-label">Fakultet</label>
                    <select class="form-select" id="fakultet-select" name="fakultet" required>
                        <option value="">Tanlang...</option>
                        {% for f in fakultetlar %}
                        <option value="{{ f.id }}">{{ f.nomi }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Kafedra -->
                <div class="col-md-6">
                    <label class="form-label">Kafedra</label>
                    <select class="form-select" id="kafedra-select" name="kafedra" required>
                        <option value="">Avval fakultetni tanlang</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label">Gmail</label>
                    <input type="email" name="gmail" class="form-control" required>
                </div>

                <div class="col-12">
                    <label class="form-label">O'zingiz haqingizda</label>
                    <textarea name="haqida" class="form-control" rows="3"></textarea>
                </div>

                <div class="col-12">
                    <label class="form-label">Rasm yuklash</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Login</label>
                    <input type="text" name="login_f" class="form-control" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Parol</label>
                    <input type="password" id="parol" name="parol" class="form-control" required>
                    <div id="parolHelp" class="form-text text-danger"></div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Parolni tasdiqlang</label>
                    <input type="password" id="parol_tasdiq" name="parolni_tasdiqlang" class="form-control" required>
                    <div id="parolMatchHelp" class="form-text text-danger"></div>
                </div>

                <script>
                    const parolInput = document.getElementById('parol');
                    const parolTasdiqInput = document.getElementById('parol_tasdiq');
                    const parolHelp = document.getElementById('parolHelp');
                    const parolMatchHelp = document.getElementById('parolMatchHelp');

                    function checkPasswordStrength(password) {
                        const minLength = 8;
                        const upperCase = /[A-Z]/;
                        const lowerCase = /[a-z]/;
                        const number = /[0-9]/;
                        const specialChar = /[!@#$%^&*()_+[\]{};':"\\|,.<>/?-]/;

                        if (password.length < minLength) {
                            return `Parol kamida ${minLength} belgidan iborat bo'lishi kerak.`;
                        }
                        if (!upperCase.test(password)) return "Parol katta harfni o'z ichiga olishi kerak (A-Z).";
                        if (!lowerCase.test(password)) return "Parol kichik harfni o'z ichiga olishi kerak (a-z).";
                        if (!number.test(password)) return "Parol raqamni o'z ichiga olishi kerak (0-9).";
                        if (!specialChar.test(password)) return "Parol maxsus belgini o'z ichiga olishi kerak (!@#$...).";

                        return ""; // hammasi yaxshi
                    }

                    // Parol kuchini tekshirish
                    parolInput.addEventListener('input', function () {
                        const errorMsg = checkPasswordStrength(parolInput.value);
                        parolHelp.textContent = errorMsg;
                    });

                    // Parolni tasdiqlash
                    parolTasdiqInput.addEventListener('input', function () {
                        if (parolTasdiqInput.value !== parolInput.value) {
                            parolMatchHelp.textContent = "Parollar mos kelmayapti!";
                        } else {
                            parolMatchHelp.textContent = "";
                        }
                    });

                    // Formani yuborishdan oldin tekshirish
                    document.querySelector('form').addEventListener('submit', function (e) {
                        const errorMsg = checkPasswordStrength(parolInput.value);
                        if (errorMsg) {
                            e.preventDefault();
                            parolHelp.textContent = errorMsg;
                            parolInput.focus();
                        } else if (parolInput.value !== parolTasdiqInput.value) {
                            e.preventDefault();
                            parolMatchHelp.textContent = "Parollar mos kelmayapti!";
                            parolTasdiqInput.focus();
                        }
                    });
                </script>


                <div class="col-12 text-center mt-3">
                    <button class="btn btn-primary px-5">Ro'yxatdan O'tish</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('fakultet-select').addEventListener('change', function () {
            let fakultetID = this.value;
            let kafedraSelect = document.getElementById('kafedra-select');
            kafedraSelect.innerHTML = '<option value="">Yuklanmoqda...</option>';

            if (fakultetID) {
                fetch(`/get-kafedralar/${fakultetID}/`)
                    .then(response => response.json())
                    .then(data => {
                        kafedraSelect.innerHTML = '<option value="">Tanlang...</option>';
                        data.kafedralar.forEach(k => {
                            kafedraSelect.innerHTML += `<option value="${k.id}">${k.nomi}</option>`;
                        });
                    });
            } else {
                kafedraSelect.innerHTML = '<option value="">Avval fakultetni tanlang</option>';
            }
        });
    </script>

</body>
</html>

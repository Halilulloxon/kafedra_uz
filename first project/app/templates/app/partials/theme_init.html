<!-- kafedra-theme-init: mavzu sahifa chizilishidan oldin qo'llanadi (oq ekran miltillamasligi uchun) -->
<script>
(function () {
    try {
        var t = localStorage.getItem('app_theme') || localStorage.getItem('theme');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            t = 'dark';
        }
        if (t !== 'dark') return;
        document.documentElement.classList.add('dark-mode');
        (function applyBody() {
            if (document.body) { document.body.classList.add('dark-mode'); }
            else { requestAnimationFrame(applyBody); }
        })();
    } catch (e) {}
})();
</script>

<!DOCTYPE html>
{% load static %}
<html>
<head>
    <!-- kafedra-theme-init: mavzu sahifa chizilishidan oldin qo'llanadi (oq ekran miltillamasligi uchun) -->
    <script>
    (function () {
        try {
            var t = localStorage.getItem('app_theme') || localStorage.getItem('theme');
            if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                t = 'dark';
            }
            if (t !== 'dark') return;
            document.documentElement.classList.add('dark-mode');
            (function applyBody() {
                if (document.body) { document.body.classList.add('dark-mode'); }
                else { requestAnimationFrame(applyBody); }
            })();
        } catch (e) {}
    })();
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>O‘quv ishlari</title>
    <link rel="stylesheet" href="{% static 'app/content/style_t.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
    <link rel="stylesheet" href="{% static 'app/app-assets/fonts/font-awesome/css/all.min.css' %}?v=20260922_3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
    <link rel="stylesheet" href="{% static 'app/app-assets/fonts/font-awesome/css/all.min.css' %}?v=20260922_3">
    <link rel="stylesheet" type="text/css" href="{% static 'app/assets/css/theme-dark-lang.css' %}?v=20260924n">
</head>
<body>
    <div>
        <header>
            <nav class="navbar fixed-top navbar-expand-sm navbar-dark bg-dark">
                <a href="#" class="navbar-brand mb-0 h1">
                    <img class="d-inline-block align-middle"
                         src="https://static.tuit.uz/crop/1/7/1200__95_1737924758.png" width="50" height="50">
                    TUIT
                </a>
                <button type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#profile"
                        class="navbar-toggler"
                        aria-controls="profile"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="profile">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a href="{% url 'profile' user_id=foydalanuvchi.id %}" class="nav-link">Profil</a></li>
                        <li class="nav-item"><a href="{% url 'oquv_ishlari'  user_id=foydalanuvchi.id %}" class="nav-link active">O‘quv ishlari</a></li>
                        <li class="nav-item"><a href="{% url 'ilmiy_ishlari'  user_id=foydalanuvchi.id %}" class="nav-link">Ilmiy ishlar</a></li>
                    </ul>
                </div>
                <form action="{% url 'logout' %}">
                    <button class="logout-btn">
                        Logout
                    </button>
                </form>
            </nav>
        </header>
    </div>

    <div class="forma mt-5 pt-5">
        <header>Tahrirlash</header>
        <div id="alert-container"></div>

        <form id="oquvForm" action="{% url 'qoshish_oquv' user_id=foydalanuvchi.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form first">
                <div class="details personal">
                    <span class="title">Ma’lumotlar</span>
                    <div class="fields">
                        <div class="input-field">
                            <label>O‘quv uslubiy ish turi:</label>
                            <select name="turi" required>
                                <option value="">Tanlang...</option>
                                <option value="Uslubiy ko‘rsatma">Uslubiy ko‘rsatma</option>
                                <option value="O‘quv qo‘llanma">O‘quv qo‘llanma</option>
                                <option value="Darslik">Darslik</option>
                                <option value="Monografiya">Monografiya</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Nomi:</label>
                            <input type="text" placeholder="Nomi" name="nomi" required>
                        </div>
                        <div class="input-field">
                            <label>Muallif:</label>
                            <select name="muallif" required>
                                <option value="">Tanlang...</option>

                                <option value="{{foydalanuvchi.id}}">{{foydalanuvchi}}</option>

                            </select>
                        </div>
                        <div class="input-field">
                            <label>Ish mualliflari:</label>
                            <input type="text" placeholder="mualliflar" name="ish_mualliflari" required>
                        </div>
                        <div class="input-field">
                            <label>Sana:</label>
                            <input type="date" name="sana" required>
                        </div>
                        <div class="input-field">
                            <label>Betlar soni:</label>
                            <input type="number" placeholder="0" name="betlar_soni" required>
                        </div>
                        <div class="file-field">
                            <label>Fayl:</label>
                            <input type="file" name="fayl" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Qo‘shish</button>
            </div>
        </form>
    </div>

    <script src="{% static 'app/scripts/form_check.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'app/assets/js/theme-dark-lang.js' %}?v=20260923s"></script>
</body>
</html>
